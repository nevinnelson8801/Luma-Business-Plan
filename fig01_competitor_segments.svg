<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1200" height="720" fill="#FFFFFF"/><text x="60.0" y="64.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">Trivandrum signage market: who the 32 competitors are</text><text x="60.0" y="96.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">Competitors by segment, with average price per sq ft</text><text x="60.0" y="692.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">Source: competitors_clean.csv (n = 32). 41% of competitors offer a premium line, but only 7 are true premium players.</text><text x="1140.0" y="692.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="end">LUMA Displays · Phase 1</text><text x="60.0" y="202.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2937" text-anchor="start">Budget / flex</text><rect x="240.0" y="170.0" width="620.0" height="52.0" rx="6" fill="#94A3B8"/><text x="874.0" y="196.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2937" text-anchor="start">15 competitors (47%)</text><text x="874.0" y="216.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">avg ₹259 / sq ft</text><text x="60.0" y="302.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2937" text-anchor="start">Mid signage</text><rect x="240.0" y="270.0" width="413.3" height="52.0" rx="6" fill="#38BDF8"/><text x="667.3" y="296.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2937" text-anchor="start">10 competitors (31%)</text><text x="667.3" y="316.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">avg ₹662 / sq ft</text><text x="60.0" y="402.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2937" text-anchor="start">Premium</text><rect x="240.0" y="370.0" width="289.3" height="52.0" rx="6" fill="#F59E0B"/><text x="543.3" y="396.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2937" text-anchor="start">7 competitors (22%)</text><text x="543.3" y="416.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">avg ₹1,286 / sq ft</text><rect x="60.0" y="490.0" width="1080.0" height="150.0" rx="10" fill="#FFF7E6"/><text x="90.0" y="530.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="start">Takeaway</text><text x="90.0" y="560.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">The market is fragmented (HHI = 479; top 4 hold 30% of review share). 15 of 32 players sit in budget flex at ~₹259/sq ft,</text><text x="90.0" y="584.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start">while premium averages ₹1,286/sq ft. LUMA can enter the premium tier without facing a dominant incumbent.</text></svg>