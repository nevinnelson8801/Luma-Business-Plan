<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1200" height="720" fill="#FFFFFF"/><text x="60.0" y="64.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">What competitors’ customers complain about</text><text x="60.0" y="96.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">Complaint themes in the 15 sample competitor reviews</text><text x="60.0" y="692.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">Source: sample reviews in the Phase 2 notebook (demo data, n = 15). Reviews can mention more than one issue. Replace with real reviews when available.</text><text x="1140.0" y="692.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="end">LUMA Displays · Phase 1</text><text x="60.0" y="196.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2937" text-anchor="start">Late / slow delivery or response</text><text x="60.0" y="216.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">Delivery speed + WhatsApp response</text><rect x="430.0" y="170.0" width="560.0" height="56.0" rx="6" fill="#EF4444"/><text x="1004.0" y="206.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2937" text-anchor="start">4 of 15</text><text x="60.0" y="296.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2937" text-anchor="start">Fading or failing materials</text><text x="60.0" y="316.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">Flex fades, board stops lighting</text><rect x="430.0" y="270.0" width="420.0" height="56.0" rx="6" fill="#EF4444"/><text x="864.0" y="306.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2937" text-anchor="start">3 of 15</text><text x="60.0" y="396.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2937" text-anchor="start">Poor finishing</text><text x="60.0" y="416.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">Visible screws on frame</text><rect x="430.0" y="370.0" width="140.0" height="56.0" rx="6" fill="#EF4444"/><text x="584.0" y="406.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2937" text-anchor="start">1 of 15</text><text x="60.0" y="496.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2937" text-anchor="start">No creativity (template work)</text><text x="60.0" y="516.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">Copy basic templates</text><rect x="430.0" y="470.0" width="140.0" height="56.0" rx="6" fill="#EF4444"/><text x="584.0" y="506.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2937" text-anchor="start">1 of 15</text><rect x="60.0" y="590.0" width="1080.0" height="70.0" rx="10" fill="#ECFDF5"/><text x="90.0" y="632.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#065F46" text-anchor="start">LUMA’s edge: on-time delivery, durable acrylic/LED build, and custom design instead of templates.</text></svg>